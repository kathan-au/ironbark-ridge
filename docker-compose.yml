services:
  postgres:
    image: postgres:16
    container_name: ironbark-db
    environment:
      POSTGRES_USER: ironbark
      POSTGRES_PASSWORD: ironbark_dev_password
      POSTGRES_DB: ironbark_ridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironbark -d ironbark_ridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: ironbark-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: ironbark-backend
    environment:
      DB_USER: ironbark
      DB_PASSWORD: ironbark_dev_password
      DB_NAME: ironbark_ridge
      DB_HOST: postgres
      DB_PORT: 5432
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ironbark-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: