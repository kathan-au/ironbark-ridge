version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: ironbark-db
    environment:
      POSTGRES_USER: ironbark
      POSTGRES_PASSWORD: ironbark_dev_password
      POSTGRES_DB: ironbark_ridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: